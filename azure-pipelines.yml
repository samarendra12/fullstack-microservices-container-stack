trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - frontend/**
      - backend/**
      - nginx/**
      - docker-compose.yml

variables:
  imageRepositoryBackend: 'todo-backend'
  imageRepositoryFrontend: 'todo-frontend'
  dockerfilePathBackend: '$(Build.SourcesDirectory)/backend/Dockerfile'
  dockerfilePathFrontend: '$(Build.SourcesDirectory)/frontend/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: TestAndValidate
    displayName: 'Test & Code Quality'
    jobs:
      - job: FrontendCI
        displayName: 'Frontend Unit & Lint Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js 18'

          - script: |
              cd frontend
              npm ci
              npm test -- --watchAll=false --passWithNoTests
            displayName: 'Run Frontend Tests'

      - job: BackendCI
        displayName: 'Backend Unit & Validation Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Install Python 3.11'

          - script: |
              cd backend
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              python -c "import app; print('Backend module imported successfully')"
            displayName: 'Validate Backend Dependencies & Import'

  - stage: SecurityScan
    displayName: 'Container Vulnerability Scanning'
    dependsOn: TestAndValidate
    jobs:
      - job: TrivyScan
        displayName: 'Trivy Image Scan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              docker build -t $(imageRepositoryBackend):$(tag) -f $(dockerfilePathBackend) backend/
              docker build -t $(imageRepositoryFrontend):$(tag) -f $(dockerfilePathFrontend) frontend/
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              trivy image --severity HIGH,CRITICAL --exit-code 0 $(imageRepositoryBackend):$(tag)
              trivy image --severity HIGH,CRITICAL --exit-code 0 $(imageRepositoryFrontend):$(tag)
            displayName: 'Build and Scan Images with Trivy'

  - stage: DeployStaging
    displayName: 'Deploy to Staging Environment'
    dependsOn: SecurityScan
    jobs:
      - deployment: DeployApp
        displayName: 'Deploy Multi-Tier App'
        environment: 'staging'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Deploying version $(tag) to Staging Host..."
                    docker compose config
                  displayName: 'Validate Compose Configuration and Rollout'
