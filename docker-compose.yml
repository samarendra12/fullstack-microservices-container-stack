version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: edge-reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - public-net
      - private-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    networks:
      - private-net
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend-api
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=*
    networks:
      - private-net
    restart: always

networks:
  public-net:
    driver: bridge
  private-net:
    internal: false
